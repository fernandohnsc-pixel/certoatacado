<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Certo Atacado</title>
    <link rel="stylesheet" href="css/painel.css">
    <style>
        .categoria-header { background: #f4f4f4; font-weight: bold; color: var(--laranja-certo); padding: 12px; border-left: 5px solid var(--laranja-certo); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 10% auto; padding: 25px; width: 450px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-editar { background: #2196F3; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; font-weight: bold; }
        .btn-editar:hover { background: #1976D2; }
        select { padding: 10px; border-radius: 6px; border: 1px solid #ddd; background: white; font-size: 14px; }
        .form-row { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-certo">certo <span class="logo-check">✓</span></div>
        <button id="btnSair" class="btn-sair">Sair do Painel</button>
    </div>

    <div class="card">
        <h2>Cadastrar Novos Encartes</h2>
        <form id="uploadForm">
            <div class="form-row">
                <input type="text" id="titulo" placeholder="Título (Ex: Ofertas Especiais)" required style="flex: 2; padding: 10px;">
                
                <select id="categoria_select" required style="flex: 1;">
                    <option value="Geral">Geral</option>
                    <option value="Dia C">Dia C</option>
                    <option value="Páscoa">Páscoa</option>
                    <option value="Dia das Mães">Dia das Mães</option>
                    <option value="Black Friday">Black Friday</option>
                    <option value="Natal">Natal</option>
                    <option value="Televendas">Televendas</option>
                </select>

                <input type="file" id="imagem" accept="image/*" multiple required style="flex: 1.5;">
                <button type="submit" id="btnEnviar" style="padding: 10px 20px;">Subir Tudo</button>
            </div>
        </form>
        <div id="status-upload" style="margin-top: 15px; font-weight: bold;"></div>
    </div>

    <div class="card">
        <h2>Encartes Ativos no Site</h2>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Imagem</th>
                        <th>Título</th>
                        <th>Data</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="listaEncartes">
                    <!-- Agrupado por categoria via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal de Edição -->
<div id="modalEditar" class="modal">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: var(--laranja-certo);">Editar Encarte</h3>
        <input type="hidden" id="edit-id">
        
        <div style="margin-bottom: 20px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Título:</label>
            <input type="text" id="edit-titulo" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
        </div>

        <div style="margin-bottom: 25px;">
            <label style="font-weight: bold; display: block; margin-bottom: 5px;">Categoria:</label>
            <select id="edit-categoria" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
                <option value="Geral">Geral</option>
                <option value="Dia C">Dia C</option>
                <option value="Páscoa">Páscoa</option>
                <option value="Dia das Mães">Dia das Mães</option>
                <option value="Black Friday">Black Friday</option>
                <option value="Natal">Natal</option>
                <option value="Televendas">Televendas</option>
            </select>
        </div>

        <div style="text-align: right; display: flex; gap: 10px; justify-content: flex-end;">
            <button onclick="fecharModal()" style="padding: 10px 20px; background: #eee; border: none; border-radius: 6px; cursor: pointer;">Cancelar</button>
            <button id="btnSalvarEdicao" style="padding: 10px 20px; background: var(--laranja-certo); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">Salvar Alterações</button>
        </div>
    </div>
</div>

<script type="module" src="js/gerenciar.js"></script>

<script>
    function fecharModal() { document.getElementById('modalEditar').style.display = 'none'; }
    window.onclick = function(event) {
        let modal = document.getElementById('modalEditar');
        if (event.target == modal) modal.style.display = "none";
    }
</script>

</body>
</html>
