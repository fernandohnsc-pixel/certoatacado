<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel Certo Atacado</title>
    
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-placeholder">
            cert<span class="logo-o">o<span class="logo-check">✓</span></span>
        </div>
        <p style="color: #888; font-size: 12px; margin-top: -10px; margin-bottom: 20px; font-weight: bold;">
            ATACADO & VAREJO
        </p>
        
        <h2>Acesso ao Painel</h2>

        <div id="mensagem-erro"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="exemplo@certoatacado.com.br">
            </div>
            
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>

            <button type="submit" id="btn-entrar">Entrar</button>
        </form>
    </div>

    <script type="module" src="js/auth.js"></script>

</body>
</html>
